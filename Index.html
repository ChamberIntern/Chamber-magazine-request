<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request More Chamber Magazines</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .card {
      max-width: 560px;
      margin: 40px auto;
      background: white;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 28px; }
    p { line-height: 1.5; }
    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 15px 24px;
      border-radius: 8px;
      background: #1f5f8b;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }
    .button:hover { opacity: .9; }
    .note {
      margin-top: 22px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Request More Chamber Magazines</h1>
    <p>
      Need more Chamber magazines for your business?
      Tap the button below to open a pre-filled email request.
    </p>

    <a class="button" href="mailto:Chamber@Sanmarcostexas.com?subject=Request%20for%20More%20Chamber%20Magazines&amp;body=Hi%2C%0A%0AI%27d%20like%20to%20request%20a%20new%20batch%20of%20Chamber%20magazines%20delivered%20to%20my%20business.%20Here%20is%20my%20info.%0A%0ABusiness%20Name%3A%0ABusiness%20Address%3A%0AAmount%20of%20Magazines%3A%0A%0ABelow%2C%20I%20will%20provide%20any%20other%20details%2C%20comments%2C%20or%20questions%20regarding%20the%20Chamber%20Magazine%20deliveries.%20If%20I%20have%20none%2C%20it%20will%20remain%20blank.%0A%0ANotes%3A%0A%0AThanks%2C">
      Open Email Request
    </a>

    <p class="note">
      Your email app will open with the recipient, subject, and message already filled in.
    </p>
  </main>
</body>
</html>
